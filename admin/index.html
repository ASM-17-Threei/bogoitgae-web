<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- connect-src의 localhost:8080은 로컬 백엔드 테스트용 — 운영 동작엔 영향 없음 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.bogoitgae.com https://kauth.kakao.com http://localhost:8080; img-src 'self' data:; base-uri 'self'" />
<meta name="robots" content="noindex, nofollow" />
<title>보고있개 관리자</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/admin.css" />
<script defer src="../js/admin-config.js"></script>
<script defer src="../js/admin.js"></script>
</head>
<body>

<!-- 로그인 -->
<section id="view-login" class="center-view" hidden>
  <h1>보고있개 관리자</h1>
  <p class="muted">관리자 계정의 카카오로 로그인하세요.</p>
  <button id="btn-kakao" class="btn btn-kakao">카카오로 로그인</button>
</section>

<!-- 권한 없음 -->
<section id="view-forbidden" class="center-view" hidden>
  <h1>접근 불가</h1>
  <p class="muted">관리자 권한이 없는 계정입니다.</p>
  <button id="btn-logout2" class="btn">로그아웃</button>
</section>

<!-- 본화면 -->
<main id="view-app" class="layout" hidden>
  <aside class="sidebar">
    <span class="brand">🐶 보고있개 관리자</span>
    <nav id="tab-nav">
      <button data-tab="users" class="tab active">👤 유저</button>
      <button data-tab="feedbacks" class="tab">📣 피드백</button>
      <button data-tab="analyses" class="tab">🤖 이벤트 분석</button>
      <button data-tab="notifications" class="tab">🔔 알림 로그</button>
    </nav>
    <button id="btn-logout" class="btn btn-sm">로그아웃</button>
  </aside>
  <div class="content">
    <div id="filters" class="filters"></div>
    <div id="table-wrap" class="table-wrap"></div>
    <div id="pager" class="pager"></div>
  </div>
</main>

<dialog id="detail"><div id="detail-body"></div></dialog>
<div id="toast" class="toast" hidden></div>

</body>
</html>
